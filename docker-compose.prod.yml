# Deployment target: Coolify. Three services from one image.
#
# `migrate` runs to completion before anything else starts, so neither the API
# nor the worker can come up against a schema they do not understand. That is
# also why migrations are not run at API boot: a rolling deploy would race them.

name: rask

services:
  migrate:
    build: .
    command: ["bun", "packages/schema/src/migrate.ts"]
    # Runs to completion and stays exited, which is success. Without this
    # Coolify counts the stopped container against the deployment's health.
    exclude_from_hc: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      CLICKUP_CLIENT_ID: ${CLICKUP_CLIENT_ID}
      CLICKUP_CLIENT_SECRET: ${CLICKUP_CLIENT_SECRET}
      CLICKUP_REDIRECT_URI: ${CLICKUP_REDIRECT_URI}
      WEB_ORIGIN: ${WEB_ORIGIN}
      # Only for a webhook created outside Rask. The ones the worker registers
      # keep their secret in the database, encrypted with TOKEN_ENCRYPTION_KEY.
      CLICKUP_WEBHOOK_SECRET: ${CLICKUP_WEBHOOK_SECRET}
    # Not published on the host: the proxy in front reaches the container over
    # the compose network, and a host binding would also cost rolling updates.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["bun", "apps/worker/src/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      CLICKUP_TEAM_ID: ${CLICKUP_TEAM_ID}
      # Where ClickUp posts events, and the reason the two poll intervals
      # differ. Blank means no webhook is registered and POLL_INTERVAL_MS is
      # the only one that applies.
      CLICKUP_WEBHOOK_URL: ${CLICKUP_WEBHOOK_URL}
      CLICKUP_WEBHOOK_LIST_ID: ${CLICKUP_WEBHOOK_LIST_ID}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-120000}
      POLL_INTERVAL_WEBHOOK_MS: ${POLL_INTERVAL_WEBHOOK_MS:-600000}
    # One worker, and now for a second reason. The outbox claim and the webhook
    # queue both use FOR UPDATE SKIP LOCKED so more would be safe to drain with,
    # but webhook registration is not idempotent across processes: two workers
    # racing at boot would each see no webhook and register one.
    deploy:
      replicas: 1
    restart: unless-stopped
