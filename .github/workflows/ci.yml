name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rask
          POSTGRES_PASSWORD: rask
          POSTGRES_DB: rask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rask -d rask"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rask:rask@localhost:5432/rask
      # Throwaway values. Real secrets never live in CI for this project: the
      # tests never talk to ClickUp, they talk to fixtures and to Postgres.
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_SECRET: Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6cXV4Zm9vYmFyYmF6cXU=
      CLICKUP_CLIENT_ID: ci-client-id
      CLICKUP_CLIENT_SECRET: ci-client-secret
      CLICKUP_REDIRECT_URI: http://localhost:3000/auth/clickup/callback
      API_PORT: "3000"
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome check .

      - name: Typecheck
        run: |
          for pkg in packages/clickup-client packages/schema apps/worker apps/api apps/web; do
            echo "::group::$pkg"
            node_modules/.bin/tsc --noEmit -p "$pkg/tsconfig.json"
            echo "::endgroup::"
          done

      - name: Create the test databases
        # One per package: the suites run in parallel, and both the outbox drain
        # and the reconciliation are global by design, so a shared database made
        # them occasionally read each other's rows.
        run: bun run db:test

      - name: Test
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      # The suite creates and seeds its own rask_e2e over a plain connection,
      # so it does not need the job's DATABASE_URL and cannot touch it.
      - name: End-to-end
        run: bunx playwright test
        working-directory: apps/web

      # `test-results`, not `playwright-report`: the CI reporter is `github`,
      # which annotates the run and writes no HTML, so this step uploaded
      # nothing for as long as it existed ("No files were found with the
      # provided path"). The traces `retain-on-failure` keeps land here, and a
      # trace is the only thing that makes a red run readable after the fact.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # The image is the deploy artifact, so a build failure is a broken deploy.
      # Nothing here pushes: Coolify builds from the repo itself.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
