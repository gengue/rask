<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rask</title>
    <script>
      /*
       * Theme, before anything else paints.
       *
       * This has to be inline and it has to be here. Reading localStorage from
       * the bundle means the first frame is drawn with whatever the stylesheet
       * says and then repainted, which on a dark theme is a white flash on
       * every single page load. Setting colorScheme as well as the class
       * covers the window before the stylesheet itself arrives, when there is
       * no CSS to paint from at all.
       *
       * The two arrays are duplicated from THEMES in src/lib/theme.ts on
       * purpose: the module cannot run early enough, and a second <script src>
       * would be a blocking request to save them. `theme.test.ts` asserts both
       * stay in step — a theme missing from KNOWN repaints on every visit, and
       * one missing from DARK gets native scrollbars the wrong way round, both
       * only for the people who picked it.
       */
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("rask.theme");
        } catch {
          // Private mode, or storage blocked. Follow the system and move on.
        }
        // Any theme that names itself is honoured as stored; anything else —
        // absent, unreadable, a name this build no longer has — follows the OS.
        const KNOWN = ["light", "dark", "ember", "brutal", "xp", "aqua", "cyber"];
        // The ones that paint near-black, so native controls take the right
        // side before the stylesheet exists.
        const DARK = ["dark", "ember", "cyber"];
        const theme = KNOWN.includes(stored)
          ? stored
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = DARK.includes(theme) ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
