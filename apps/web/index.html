<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rask</title>
    <script>
      /*
       * Theme, before anything else paints.
       *
       * This has to be inline and it has to be here. Reading localStorage from
       * the bundle means the first frame is drawn with whatever the stylesheet
       * says and then repainted, which on a dark theme is a white flash on
       * every single page load. Setting colorScheme as well as the class
       * covers the window before the stylesheet itself arrives, when there is
       * no CSS to paint from at all.
       *
       * The six lines are duplicated from src/lib/theme.ts on purpose: the
       * module cannot run early enough, and a second <script src> would be a
       * blocking request to save a duplicated string key.
       */
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("rask.theme");
        } catch {
          // Private mode, or storage blocked. Follow the system and move on.
        }
        const theme =
          stored === "ember"
            ? "ember"
            : stored === "dark" ||
                (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
        // Ember is a dark theme as far as native controls go.
        document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
