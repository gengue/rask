<!-- Flecked cream paper for the panels: procedural speckle at 5% alpha, so
     the audited panel token still owns the colour under it. -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="180" height="180">
  <filter id="p">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.07 0 0 0 0 0.07 0 0 0 0 0.09 0 0 0 0.05 0"/>
  </filter>
  <rect width="180" height="180" filter="url(#p)"/>
</svg>
