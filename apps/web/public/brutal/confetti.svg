<!-- Memphis confetti for the wall: squiggles, triangles, rings, crosses,
     halftone patches. Painted only where the wall shows (page edges and the
     gaps between panels), so density is tuned for glimpses, not a poster.
     Every shape sits above the violet token; none of them is a surface. -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="560" height="560" viewBox="0 0 560 560">
  <g fill="none" stroke-linecap="square">
    <!-- squiggles -->
    <path d="M20 60q14-22 28 0t28 0t28 0" stroke="#ffd93d" stroke-width="7"/>
    <path d="M356 500q12-20 24 0t24 0t24 0" stroke="#131316" stroke-width="6"/>
    <path d="M420 128q12-20 24 0t24 0" stroke="#2ee0c6" stroke-width="6"/>
    <path d="M96 388q10-18 20 0t20 0" stroke="#ffffff" stroke-width="5" opacity=".85"/>
    <!-- rings -->
    <circle cx="480" cy="300" r="17" stroke="#ff90c8" stroke-width="7"/>
    <circle cx="150" cy="210" r="11" stroke="#131316" stroke-width="6"/>
    <circle cx="60" cy="500" r="14" stroke="#ffd93d" stroke-width="6"/>
    <!-- triangles -->
    <path d="M276 40l22 38h-44z" stroke="#131316" stroke-width="6"/>
    <path d="M520 460l18 30h-36z" stroke="#ffffff" stroke-width="5" opacity=".85"/>
    <path d="M210 480l16 28h-32z" stroke="#2ee0c6" stroke-width="5"/>
    <!-- crosses -->
    <path d="M388 232v24m-12-12h24" stroke="#ffd93d" stroke-width="6"/>
    <path d="M60 300v20m-10-10h20" stroke="#131316" stroke-width="5"/>
    <path d="M300 320v20m-10-10h20" stroke="#ff90c8" stroke-width="5"/>
  </g>
  <!-- solid odds and ends -->
  <circle cx="330" cy="180" r="6" fill="#131316"/>
  <circle cx="520" cy="60" r="7" fill="#ff90c8"/>
  <circle cx="180" cy="80" r="5" fill="#ffffff" opacity=".85"/>
  <!-- halftone patches, 4x4 -->
  <g fill="#131316">
    <circle cx="40" cy="150" r="3"/><circle cx="54" cy="150" r="3"/><circle cx="68" cy="150" r="3"/><circle cx="82" cy="150" r="3"/>
    <circle cx="40" cy="164" r="3"/><circle cx="54" cy="164" r="3"/><circle cx="68" cy="164" r="3"/><circle cx="82" cy="164" r="3"/>
    <circle cx="40" cy="178" r="3"/><circle cx="54" cy="178" r="3"/><circle cx="68" cy="178" r="3"/><circle cx="82" cy="178" r="3"/>
    <circle cx="40" cy="192" r="3"/><circle cx="54" cy="192" r="3"/><circle cx="68" cy="192" r="3"/><circle cx="82" cy="192" r="3"/>
  </g>
  <g fill="#ffd93d">
    <circle cx="452" cy="396" r="3"/><circle cx="466" cy="396" r="3"/><circle cx="480" cy="396" r="3"/><circle cx="494" cy="396" r="3"/>
    <circle cx="452" cy="410" r="3"/><circle cx="466" cy="410" r="3"/><circle cx="480" cy="410" r="3"/><circle cx="494" cy="410" r="3"/>
    <circle cx="452" cy="424" r="3"/><circle cx="466" cy="424" r="3"/><circle cx="480" cy="424" r="3"/><circle cx="494" cy="424" r="3"/>
  </g>
</svg>
