<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="36" height="180" viewBox="0 0 36 180">
  <!-- The vertical rail that runs down the sidebar's edge: twin iron columns
       with a banded joint per tile. Tiles seamlessly on repeat-y — every
       vertical element runs the full height, the band appears once. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b5334"/>
      <stop offset=".35" stop-color="#3a2d1c"/>
      <stop offset="1" stop-color="#15100a"/>
    </linearGradient>
  </defs>
  <rect x="15.5" y="0" width="5" height="180" fill="#171208"/>
  <rect x="7" y="0" width="7" height="180" fill="url(#m)" stroke="#0b0805" stroke-width="1"/>
  <rect x="22" y="0" width="7" height="180" fill="url(#m)" stroke="#0b0805" stroke-width="1"/>
  <rect x="7.8" y="0" width="1.2" height="180" fill="#a8854f" opacity="0.7"/>
  <rect x="22.8" y="0" width="1.2" height="180" fill="#a8854f" opacity="0.55"/>
  <rect x="4" y="82" width="28" height="16" rx="2" fill="#312616" stroke="#0b0805"/>
  <rect x="5" y="83" width="26" height="2" fill="#6b5334" opacity="0.75"/>
  <circle cx="8.5" cy="90" r="1.8" fill="#77603c" stroke="#171008" stroke-width="0.8"/>
  <circle cx="27.5" cy="90" r="1.8" fill="#77603c" stroke="#171008" stroke-width="0.8"/>
  <rect x="15" y="87" width="6" height="6" transform="rotate(45 18 90)" fill="#55422a" stroke="#171008" stroke-width="1"/>
</svg>
